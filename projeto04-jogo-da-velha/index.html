<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da velha</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main>
        <h1>Jogo da Velha</h1>
        <div class="areas">
            <div data-area="a1" class="area b r"></div>
            <div data-area="a2" class="area b r"></div>
            <div data-area="a3" class="area b"></div>
            <div data-area="b1" class="area b r"></div>
            <div data-area="b2" class="area b r"></div>
            <div data-area="b3" class="area b"></div>
            <div data-area="c1" class="area r"></div>
            <div data-area="c2" class="area r"></div>
            <div data-area="c3" class="area"></div>
        </div>

        <div class="painelControle">
            <div class="jogadorVez">
                <div class="tituloJogador">Jogador</div>
                <div class="vez">--</div>
            </div>
            <div class="Resultado">
                <div class="tituloResultado">Vencedor</div>
                <div class="resultado">--</div>
            </div>
        </div>
        <div class="btn">
            <button class="reset">Reset</button>
        </div>
    </main>

    <script src="assets/js/script.js"></script>
</body>
</html>
